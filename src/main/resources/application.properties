# 应用名（日志里会显示）
spring.application.name=demo

# ===== 数据源配置：告诉 Spring Boot 连哪个数据库 =====
# URL 格式：jdbc:mysql://主机:端口/数据库名?参数
# 注意端口是 3307（新装的 MySQL 8.0），不是 3306
spring.datasource.url=jdbc:mysql://localhost:3307/demo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 密码不放明文：用环境变量 DB_PASSWORD 占位。
# 真实密码只存在你本机 IDEA 的运行配置里（见后面步骤），不会被上传到 GitHub。
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus 配置 =====
# 把数据库的下划线字段名自动映射成 Java 驼峰名：create_time -> createTime
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 在控制台打印 MyBatis-Plus 实际执行的 SQL（学习阶段打开，能看清它干了什么）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
